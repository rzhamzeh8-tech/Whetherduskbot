<style>

.view{display:none}.view.on{display:block}

.temp{font-size:92px;font-weight:200;letter-spacing:-.05em;line-height:1;margin-top:8px}
.hc .c{display:flex;align-items:center;gap:8px;font-size:16px;margin-top:4px}.hc .c svg{width:24px;height:24px}

.rg{flex:1;display:flex;align-items:center;gap:8px}.rg em{font-style:normal;width:34px;font-size:14px}.rg em:first-child{text-align:right;color:var(--mu)}
.bar{flex:1;height:5px;border-radius:9px;background:var(--s2);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.dd{font-size:12px;color:var(--mu);margin:6px 0 0;padding-inline-start:76px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.grid .card{margin:0;min-height:150px;display:flex;flex-direction:column}
.grid .big{font-size:36px;font-weight:300;letter-spacing:-.03em;margin-top:auto}.grid .big small{font-size:14px;color:var(--mu);margin-inline-start:3px}
.grid .full{grid-column:1/-1}
.mt{height:5px;border-radius:9px;background:var(--s2);margin:10px 0 8px;overflow:hidden}.mt i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width 1s}
.sun{display:flex;justify-content:space-between;font-size:26px;font-weight:300;margin-top:8px}
.sk{border-radius:18px;background:linear-gradient(90deg,var(--s) 25%,var(--s2) 50%,var(--s) 75%);background-size:220% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-220% 0}}
.search{display:flex;align-items:center;gap:10px;background:var(--s);border:1px solid var(--ln);border-radius:20px;padding:0 16px;height:54px;margin-top:16px;transition:border-color .2s}
.search:focus-within{border-color:var(--ac)}.search svg{width:19px;height:19px;color:var(--mu);flex:none}.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:16px;background:var(--ac);color:var(--bg);font-weight:600;margin-top:12px;transition:transform .2s}
.btn.g{background:var(--s);color:var(--tx);border:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{padding:9px 14px;border-radius:99px;border:1px solid var(--ln);background:var(--s);font-size:13.5px}
.rs{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--ln);width:100%;text-align:start}
.rs b{font-weight:500;display:block}.rs svg{width:18px;height:18px;color:var(--ac);flex:none}
.empty{text-align:center;padding:44px 20px}.empty svg{width:42px;height:42px;color:var(--ac);margin-bottom:12px}.empty b{display:block;font-size:18px;font-weight:500;margin-bottom:6px}
.pf{text-align:center;padding:28px 16px}.pf .av{width:92px;height:92px;font-size:34px;margin:0 auto 14px;border-color:var(--ac)}
.pf h3{font-size:24px;font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--ln);font-size:14px}.kv:first-child{border:0}.kv span:last-child{color:var(--mu);word-break:break-all;text-align:end}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:4px 0;text-align:start}
.sw{display:inline-flex;gap:4px}.sw i{width:14px;height:14px;border-radius:50%;border:1px solid var(--ln)}
.nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,430px);display:flex;padding:6px;border-radius:28px;z-index:20;background:color-mix(in srgb,var(--s) 68%,transparent);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid var(--ln);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.nav::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:22px;background:var(--s2);border:1px solid var(--ln);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s cubic-bezier(.3,1.2,.4,1)}
.nav button{position:relative;flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mu);font-size:10px;transition:color .3s}
.nav button.on{color:var(--ac)}.nav svg{width:21px;height:21px}
#sh{position:fixed;inset:0;z-index:50;pointer-events:none}#sh.on{pointer-events:auto}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .35s;backdrop-filter:blur(3px)}#sh.on .bd{opacity:1}
.pn{position:absolute;left:50%;bottom:0;width:min(100%,560px);transform:translate(-50%,105%);background:var(--s);border:1px solid var(--ln);border-radius:28px 28px 0 0;padding:12px 18px calc(22px + env(safe-area-inset-bottom));transition:transform .5s cubic-bezier(.2,.9,.2,1)}#sh.on .pn{transform:translate(-50%,0)}
.gr{width:40px;height:4px;border-radius:9px;background:var(--ln);margin:0 auto 16px}
.th{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 4px;border-top:1px solid var(--ln);text-align:start}.th:first-child{border:0}
.th.on b::after{content:"  ●";color:var(--ac);font-size:10px}
.nav,.ch,.rg{direction:ltr}.ib{width:40px;height:40px}.top{gap:10px}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:3px;margin-top:10px}.seg button{flex:1;height:40px;border-radius:11px;color:var(--mu);transition:all .3s}.seg button.on{background:var(--ac);color:var(--bg);font-weight:600}
.x{width:24px;height:24px;border-radius:50%;background:var(--s2);display:none;place-items:center;flex:none;color:var(--mu)}.x.on{display:grid}.x svg{width:12px!important;height:12px!important}
.note{font-size:12.5px;color:var(--mu);padding:12px 4px}
.dots{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}.dots button{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);transition:transform .25s}.dots button.on{border-color:var(--tx);transform:scale(1.12)}
html[dir=rtl] body{font-family:Vazirmatn,"SF Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
body::after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;left:-25vmax;bottom:-35vmax;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 15%,transparent),transparent);animation:dr 20s ease-in-out infinite alternate;will-change:transform;pointer-events:none}

.hc{z-index:1}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.1) 50%,transparent 58%);transform:translateX(-110%);animation:sw 8s 1.5s ease-in-out infinite}

.hc .c svg{animation:fl 5s ease-in-out infinite}

.fi{animation:in2 .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0)*45ms)}
@keyframes in2{from{opacity:0;transform:translateY(12px)}}
.card,.hr,.chip,.rs,.dr{transition:transform .25s,border-color .25s,background-color .5s}
.card:active,.hr:active{transform:scale(.985)}
.hr:hover,.card:hover{border-color:color-mix(in srgb,var(--ac) 45%,var(--ln))}
.cl{stroke-dasharray:1;stroke-dashoffset:1;animation:dw 1.5s .25s cubic-bezier(.3,.7,.2,1) forwards}

.ar{animation:fo 1.2s .5s both}.ch .pk,.ch circle{animation:fo .6s 1.3s both}

.ch rect{transform-box:fill-box;transform-origin:50% 100%;animation:gb .8s cubic-bezier(.2,.8,.2,1) both}

::view-transition-old(root),::view-transition-new(root){animation-duration:.6s}

</style>

async function jf(url,ms=10000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}catch(e){throw new Error(e&&e.name==='AbortError'?'timeout':navigator.onLine?'net':'offline')}finally{clearTimeout(t)}}
const wxURL=c=>`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,cloud_cover,surface_pressure,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,visibility,uv_index,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,uv_index_max&forecast_days=16&timezone=auto&wind_speed_unit=kmh`;
async function cityImg(c){
  const fa=/[\u0600-\u06FF]/.test(c.name),h=fa?'fa':'en';
  for(const t of [c.name,c.admin1?c.name+', '+c.admin1:null]){
    if(!t)continue;
    try{const d=await jf(`https://${h}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,'_'))}`,7000);
      const th=d.thumbnail&&d.thumbnail.source;
      if(d.type==='standard'&&th)return{src:th.replace(/\/\d+px-/,'/960px-'),alt:th,page:d.content_urls&&d.content_urls.desktop&&d.content_urls.desktop.page}
    }catch(e){}
  }
  return null;
}
const same=(a,b)=>a&&b&&Math.abs(a.lat-b.lat)<.01&&Math.abs(a.lon-b.lon)<.01;
const save=()=>ls.set(K,{city:S.city,wx:S.wx,at:S.at,img:S.img});
async function load(c,silent){
  S.city=c;S.err=null;S.busy=true;
  if(!silent){S.wx=null;S.img=null}
  spin(true);render();
  try{
    const wx=await jf(wxURL(c),12000);
    S.wx=wx;S.at=Date.now();S.stale=false;S.busy=false;S.err=null;
    const k=ls.get(K);S.img=same(k&&k.city,c)&&k.img?k.img:null;
    save();render();count();
    cityImg(c).then(i=>{if(same(S.city,c)){S.img=i;save();applyImg()}}).catch(()=>{});
  }catch(e){
    const k=ls.get(K);S.busy=false;
    if(same(k&&k.city,c)&&k.wx){S.wx=k.wx;S.at=k.at;S.img=k.img;S.stale=true}else S.err=e.message;
    render();
  }
  spin(false);
}
function spin(on){const b=$('#rf');b&&b.classList.toggle('sp',on)}

const T24=()=>{const H=S.wx.hourly,i0=idx();return Array.from({length:24},(_,k)=>H.time[i0+k]?hhmm(H.time[i0+k]):'')};
function smooth(p){let d=`M${p[0][0]},${p[0][1]}`;for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;d+=`C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d}
function chart(id,v,kind,fmt){
  const W=520,Hh=160,Pd=16,n=v.length,mn=kind=='bar'?0:Math.min(...v),mx=kind=='bar'?Math.max(100,...v):Math.max(...v),L=T24();
  const x=i=>Pd+i*(W-2*Pd)/(n-1),y=a=>Hh-26-(a-mn)/((mx-mn)||1)*(Hh-60);
  let g='';for(let i=0;i<n;i+=6)g+=`<text x="${x(i)}" y="${Hh-6}" text-anchor="middle">${L[i]}</text>`;

let fxr=0,rt;
function fx(){
  cancelAnimationFrame(fxr);fxr=0;
  const cv=$('#fx');
  if(!cv||!S.wx||S.view!=='home'||document.hidden||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const w=cv.clientWidth,h=cv.clientHeight,x=cv.getContext&&cv.getContext('2d');
  if(!w||!h||!x)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=w*dpr;cv.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const c=S.wx.current,k=c.weather_code,night=!c.is_day,R=Math.random;
  const mode=k>=95?'storm':(k>=51&&k<=67)||(k>=80&&k<=82)?'rain':(k>=71&&k<=77)||k===85||k===86?'snow':k<=2&&night?'stars':'motes';
  const n=mode==='rain'||mode==='storm'?70:mode==='snow'?55:mode==='stars'?45:28;
  const ps=Array.from({length:n},()=>({x:R()*w,y:R()*h,v:mode==='snow'?.5+R()*1.2:mode==='motes'?.15+R()*.4:9+R()*7,r:.6+R()*1.8,ph:R()*6.28,l:10+R()*14}));
  let fl=0;

    if(S.view!=='home'||document.hidden||!cv.isConnected){fxr=0;return}
    x.clearRect(0,0,w,h);
    if(mode==='rain'||mode==='storm'){
      x.strokeStyle='rgba(200,220,255,.42)';x.lineWidth=1;x.beginPath();
      for(const p of ps){x.moveTo(p.x,p.y);x.lineTo(p.x-p.l*.18,p.y-p.l);p.y+=p.v;p.x+=p.v*.18;if(p.y-p.l>h||p.x>w+20){p.y=-p.l;p.x=R()*w}}
      x.stroke();
      if(mode==='storm'){if(R()<.006)fl=1;if(fl>.02){x.fillStyle=`rgba(255,255,255,${fl*.28})`;x.fillRect(0,0,w,h);fl*=.88}}
    }else if(mode==='snow'){
      x.fillStyle='rgba(255,255,255,.85)';
      for(const p of ps){p.y+=p.v;p.x+=Math.sin(t/900+p.ph)*.4;x.beginPath();x.arc(p.x,p.y,p.r+.4,0,6.283);x.fill();if(p.y>h+5){p.y=-5;p.x=R()*w}}
    }else if(mode==='stars'){

    }

  };
  fxr=requestAnimationFrame(step);
}

  $$('[data-n]').forEach(e=>{const to=+e.dataset.n,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/900);e.textContent=deg(to*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)};requestAnimationFrame(f)});
}
let tk=0;addEventListener('scroll',()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;const i=$('#himg');if(i&&S.view==='home')i.style.transform=`translateY(${Math.min(scrollY,500)*.16}px) scale(1.06)`})},{passive:true});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-v],[data-a],[data-t],[data-g],[data-l],[data-i],#rf,#loc');if(!t)return;
  if(t.dataset.v)return go(t.dataset.v);
  if(t.dataset.t)return setTheme(t.dataset.t);
  if(t.dataset.l)return setLang(t.dataset.l);
  if(t.dataset.g!=null)return pick(GZ[+t.dataset.g]);
  if(t.dataset.i!=null)return R[+t.dataset.i]&&pick(R[+t.dataset.i]);
  if(t.id==='loc')return locate();
  if(t.id==='rf')return S.city?load(S.city,true):go('se');
  const a=t.dataset.a;closeSheet();
  if(a==='search')go('se');else if(a==='locate')go('se'),locate();else if(a==='retry')S.city&&load(S.city);else if(a==='themes')themeSheet();else if(a==='requery')onq($('#q').value,1);
});
$('#q').addEventListener('input',e=>onq(e.target.value));
$('#sf').addEventListener('submit',e=>{e.preventDefault();onq($('#q').value,1);$('#q').blur()});
$('.x').addEventListener('click',()=>{const q=$('#q');q.value='';onq('');q.focus()});
function setLang(l){lang=l;ls.set(LK,l);applyLang();render();tr(document.body);if(S.view==='se'&&!$('#q').value.trim())showRec();closeSheet()}
addEventListener('online',()=>S.city&&load(S.city,true));
addEventListener('offline',()=>{if(S.wx){S.stale=true;home()}});

/* ---------- boot ---------- */
(()=>{const t=ls.get(TK);if(t&&THEMES.some(x=>x[0]===t)){document.documentElement.dataset.theme=t;$('meta[name=theme-color]').content=THEMES.find(x=>x[0]===t)[3]}})();
const k=ls.get(K);
if(k&&k.city&&k.wx){S.city=k.city;S.wx=k.wx;S.at=k.at;S.img=k.img;S.stale=!navigator.onLine}
applyLang();render();count();
go(location.hash.slice(1)||'home',false);history.replaceState({v:S.view},'','#'+S.view);
tr(document.body);mo.observe(document.body,{childList:true,subtree:true});
if(S.city&&navigator.onLine)load(S.city,true);
})();
</script>
</body>
</html>
